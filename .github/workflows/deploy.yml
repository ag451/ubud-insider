name: Deploy to GitHub Pages

# NOTE: The canonical deployment target is Railway (see railway.json), which runs
# the Node/Express backend (Google Places proxy + database). GitHub Pages only
# serves static files, so the /api/* endpoints DO NOT work on a Pages deploy.
# This workflow is therefore manual-only (workflow_dispatch) to avoid shipping a
# broken static build on every push to main.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4